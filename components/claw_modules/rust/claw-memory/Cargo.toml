[package]
name = "claw-memory"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Agent memory subsystem: conversation tape, compaction, and the shared memory task pool"

[lib]
crate-type = ["rlib"]

[features]
# The default `LlmCompactor` pulls in `claw-api`. Disable to keep the crate
# LLM-free (inject your own `Compactor`).
default = ["llm"]
llm = ["dep:claw-api"]
# `NoopCompactor`: a never-compacts stub for host CLIs and tests (host-only).
compactor-stub = []

[dependencies]
claw-interface = { path = "../claw-interface" }
claw-sys = { path = "../claw-sys" }
claw-api = { path = "../claw-api", optional = true }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Host-only filesystem doubles shared from claw-interface (tests only).
# diskfs-pretty implies diskfs and pretty-prints on-disk JSON for inspection.
claw-interface = { path = "../claw-interface", features = ["memfs", "diskfs-pretty"] }
