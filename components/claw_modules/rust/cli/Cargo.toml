[package]
name = "claw-chat"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chat"
path = "src/main.rs"

[dependencies]
claw_core = { path = "../claw_core" }
claw-api = { path = "../claw-api" }
claw-memory = { path = "../claw-memory" }
claw_interfaces = { path = "../claw_interfaces" }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
