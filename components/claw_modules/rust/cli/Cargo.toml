[package]
name = "claw-agent-cli"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"

[lib]
name = "claw_agent_cli"
path = "src/lib.rs"

[[bin]]
name = "base-agent"
path = "src/main.rs"

[[bin]]
name = "conversation-agent-chat"
path = "src/conversation_agent_chat.rs"

[dependencies]
claw_core = { path = "../claw_core" }
claw-api = { path = "../claw-api" }
claw-memory = { path = "../claw-memory" }
claw_interfaces = { path = "../claw_interfaces", features = ["diskfs", "realhttp"] }
dotenvy = "0.15"
owo-colors = "4"
serde_json = "1"
