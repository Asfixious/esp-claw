[package]
name = "claw-api"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "LLM client (OpenAI-/Anthropic-compatible chat + media inference over the ClawHttp trait), extracted from claw_core::llm"

[lib]
name = "claw_api"
crate-type = ["rlib"]

[dependencies]
claw_interfaces = { path = "../claw_interfaces" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
# Real HTTP transport for the `#[ignore]`d live mock-endpoint integration tests
# (host-only; never compiled into the firmware lib build).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
indexing_slicing = "forbid"
panic = "forbid"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "forbid"
