[package]
name = "claw_rt"
version = "0.1.0"
edition = "2021"
description = "Single staticlib aggregator that bundles all migrated claw_modules Rust crates into one archive (libclaw_rt.a) so their #[no_mangle] C-ABI symbols are emitted exactly once."

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# claw_capi owns every #[no_mangle] C-ABI symbol for the claw modules and
# depends on the pure-Rust logic crates. Re-exporting it from lib.rs forces
# rustc to link all those objects into the single libclaw_rt.a that the ESP-IDF
# claw_core component links.
claw_capi = { path = "../claw_capi" }
