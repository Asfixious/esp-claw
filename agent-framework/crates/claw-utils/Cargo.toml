[package]
name = "claw-utils"
authors = ["Finn(Ziheng) Sheng <zsheng2@ncsu.edu>", "Finn(Ziheng) Sheng <robcholz00@gmail.com>"]
version = "0.1.0"
edition = "2021"
description = "Shared utilities: cooperative tasks, stream parts, log-safe text, and prefixed ids"

[lib]
name = "claw_utils"
crate-type = ["rlib"]

[dependencies]
futures-channel = { version = "0.3", default-features = false, features = ["alloc"] }
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
