version: 1.0.0
# Peripherals Configuration for Waveshare ESP32-S3-Touch-LCD-4.3C (WS43C)

peripherals:
  # Shared I2C bus: touch, AXP2101 PMU, QMI8658 IMU, PCF85063 RTC, ES8311, ES7210.
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 8
        scl: 9

  # I2S port 0: ES8311 playback + ES7210 capture.
  - name: i2s_audio_out
    type: i2s
    role: master
    format: std-out
    config: &i2s0_config
      port: 0
      sample_rate_hz: 24000
      mclk_multiple: 256
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_STEREO
      slot_mask: I2S_STD_SLOT_BOTH
      ws_width: 16
      pins:
        mclk: 6
        bclk: 44
        ws: 16
        dout: 15
        din: 43

  - name: i2s_audio_in
    type: i2s
    role: master
    format: std-in
    config: *i2s0_config

  

 
