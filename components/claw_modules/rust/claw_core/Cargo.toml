[package]
name = "claw_core"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Runtime primitives: orchestrator shell, channels, and iteration loop"

[lib]
# claw_core is a pure-Rust rlib bundled (with the other logic crates) into the
# single `claw_rt` staticlib that the firmware links.
crate-type = ["rlib"]

[features]
# Mirrors CONFIG_CLAW_CORE_STAGE_VERBOSITY_VERBOSE (default off == "Simple").
stage_verbose = []

[dependencies]
claw-interface = { path = "../claw-interface" }
claw-utils = { path = "../claw-utils" }
claw-api = { path = "../claw-api" }
claw-memory = { path = "../claw-memory" }
log = "0.4"
# Observability facade. `log-always` routes every `tracing` event through the
# `log` crate to the existing `ClawLogger` (-> esp_log on device), so no tracing
# Subscriber is needed yet. `std` kept (default), `attributes` dropped to avoid
# the `syn` build cost until `#[instrument]` is actually used.
tracing = { version = "0.1", default-features = false, features = ["std", "log-always"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Host-only fs/http doubles + live transport shared from claw-interface (tests only).
claw-interface = { path = "../claw-interface", features = [
    "memfs",
    "diskfs",
    "httpmock",
    "realhttp",
] }
# Never-compacts `NoopCompactor` shared from claw-memory (tests only).
claw-memory = { path = "../claw-memory", features = ["compactor-stub"] }
claw_cap = { path = "../claw_cap" }
dotenvy = "0.15"
serde_json = "1"
