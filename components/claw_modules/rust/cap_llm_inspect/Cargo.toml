[package]
name = "cap_llm_inspect"
version = "0.1.0"
edition = "2021"
description = "inspect_image capability (port of cap_llm_inspect.c), exporting cap_llm_inspect_register_group"

[lib]
# rlib only; the #[no_mangle] symbols are bundled into libclaw_rt.a via claw_rt.
crate-type = ["rlib"]

[dependencies]
claw_core = { path = "../claw_core" }
claw_interfaces = { path = "../claw_interfaces" }
serde_json = "1"
log = "0.4"
