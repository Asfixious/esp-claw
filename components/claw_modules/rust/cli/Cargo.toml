[package]
name = "claw-agent-cli"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Host CLIs that drive the claw agents (BaseAgent, ConversationAgent) against a live LLM with on-disk memory for off-device manual testing"

[lib]
name = "claw_agent_cli"
path = "src/lib.rs"

[[bin]]
name = "base-agent"
path = "src/base_agent_cli.rs"

[[bin]]
name = "conversation-agent-chat"
path = "src/conversation_agent_cli.rs"

[dependencies]
claw_core = { path = "../claw_core" }
claw-api = { path = "../claw-api" }
claw-memory = { path = "../claw-memory", features = ["compactor-stub"] }
claw-interface = { path = "../claw-interface", features = ["diskfs", "realhttp"] }
dotenvy = "0.15"
owo-colors = "4"
serde_json = "1"
