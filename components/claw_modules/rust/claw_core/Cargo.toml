[package]
name = "claw_core"
version = "0.1.0"
edition = "2021"
description = "Agent core (port of the claw_core component), exporting the claw_core.h C ABI"

[lib]
# claw_core is now an rlib consumed by the single `claw_rt` staticlib aggregator
# (which bundles claw_core + claw_memory + cap_llm_inspect into one archive so
# their #[no_mangle] symbols are not duplicated across multiple staticlibs).
crate-type = ["rlib"]

[features]
# Mirrors CONFIG_CLAW_CORE_STAGE_VERBOSITY_VERBOSE (default off == "Simple").
stage_verbose = []

[dependencies]
claw_interfaces = { path = "../claw_interfaces" }
claw-api = { path = "../claw-api" }
claw_sys = { path = "../claw_sys" }
# claw_paths and claw_task expose their own C ABI but ship no separate archive;
# they are re-exported from lib.rs so their #[no_mangle] symbols land in the
# single libclaw_core.a that the firmware links.
claw_paths = { path = "../claw_paths" }
claw_task = { path = "../claw_task" }
log = "0.4"
serde_json = "1"

[dev-dependencies]
serde_json = "1"
