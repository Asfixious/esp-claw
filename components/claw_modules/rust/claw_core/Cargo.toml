[package]
name = "claw_core"
version = "0.1.0"
edition = "2021"
description = "Multi-agent runtime: orchestrator, semantic agents, and iteration loop"

[lib]
# claw_core is a pure-Rust rlib. Its C ABI lives in the `claw_capi` crate, which
# is bundled (with the other logic crates) into the single `claw_rt` staticlib.
crate-type = ["rlib"]

[features]
# Mirrors CONFIG_CLAW_CORE_STAGE_VERBOSITY_VERBOSE (default off == "Simple").
stage_verbose = []

[dependencies]
claw_cap = { path = "../claw_cap" }
claw_interfaces = { path = "../claw_interfaces" }
claw-api = { path = "../claw-api" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
