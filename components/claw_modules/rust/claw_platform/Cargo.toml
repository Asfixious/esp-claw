[package]
name = "claw_platform"
version = "0.1.0"
edition = "2021"
description = "Platform abstraction traits and target ABI types for the claw_modules Rust crates"

[lib]
crate-type = ["rlib"]

[dependencies]
# `default-features = false` keeps libc no_std; we only use its type and
# constant definitions for the `espidf` target.
libc = { version = "0.2", default-features = false }
