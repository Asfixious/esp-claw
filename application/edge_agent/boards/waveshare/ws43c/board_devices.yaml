version: 1.0.0
# Devices Configuration for Waveshare ESP32-S3-Touch-LCD-4.3C (WS43C) board.

devices:
  # ES8311 speaker playback path.
  - name: audio_dac
    chip: es8311
    type: audio_codec
    version: default
    config:
      adc_enabled: false
      dac_enabled: true
      dac_max_channel: 1
      dac_channel_mask: "1"
      dac_init_gain: 0
      mclk_enabled: true
    peripherals:
      - name: i2s_audio_out
      - name: i2c_master
        address: 0x30
        frequency: 400000

  # ES7210 dual microphone capture path.
  - name: audio_adc
    chip: es7210
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      adc_max_channel: 4
      adc_channel_mask: "0011"
      adc_init_gain: 0
    peripherals:
      - name: i2s_audio_in
      - name: i2c_master
        address: 0x80
        frequency: 400000

  # Optional microSD slot, wired as 1-bit SDMMC in Waveshare's ESP-IDF BSP.
  # - name: fs_sdcard
  #   type: fs_fat
  #   sub_type: sdmmc
  #   version: default
  #   config:
  #     vfs_config:
  #       format_if_mount_failed: false
  #       max_files: 5
  #     sub_config:
  #       bus_width: 1
  #       pins:
  #         clk: 2
  #         cmd: 1
  #         d0: 3

  - name: display_lcd
    chip: generic_rgb
    type: display_lcd
    version: 1.0.0
    sub_type: rgb
    config:
      swap_xy: false
      mirror_y: false
      mirror_x: false
      invert_color: false
      need_reset: true
      bits_per_pixel: 16
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      data_endian: LCD_RGB_DATA_ENDIAN_BIG
      rgb_panel_config:
        clk_src: LCD_CLK_SRC_DEFAULT
        data_width: 16
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        num_fbs: 2
        bounce_buffer_size_px: 8000
        dma_burst_size: 64
        hsync_gpio_num: 46
        vsync_gpio_num: 3
        de_gpio_num: 5
        pclk_gpio_num: 7
        disp_gpio_num: -1
        data_gpio_nums: [14,38,18,17,10,39,0,45,48,47,21,1,2,42,41,40]
        timings:
          pclk_hz: 16000000
          h_res: 800
          v_res: 480
          hsync_pulse_width: 8
          hsync_back_porch: 8
          hsync_front_porch: 4
          vsync_pulse_width: 8
          vsync_back_porch: 8
          vsync_front_porch: 4
          flags:
            pclk_active_neg: true
        flags:
          fb_in_psram: true
  - name: ws43c_touch_preinit
    type: custom
    config: {}
    peripherals:
      - name: i2c_master
  - name: lcd_touch
    chip: gt911
    type: lcd_touch
    sub_type: i2c
    version: default
    depends_on: ws43c_touch_preinit
    dependencies:
      esp_lcd_touch:
        version: "*"
        require: public
      espressif/esp_lcd_touch_gt911: "*"
    config:
      io_i2c_config:
        lcd_cmd_bits: 16
        scl_speed_hz: 400000
      touch_config:
        x_max: 800
        y_max: 480
        rst_gpio_num: -1
        int_gpio_num: 4
        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false
    peripherals:
      - name: i2c_master
        i2c_addr: [0xba, 0x28]

  # Metadata for the onboard QMI8658. ESP-Claw does not yet include a QMI8658
  # lua_module_imu backend, so this is intentionally not auto-initialized.
  - name: imu_sensor
    chip: qmi8658
    type: custom
    version: 1.0.0
    init_skip: true
    config:
      i2c_addr: 0x6b
      frequency: 400000
      int1_gpio_num: 17
      int2_gpio_num: 21
    peripherals:
      - name: i2c_master

  # Metadata for the onboard AXP2101 PMU. The default hardware rails are left
  # untouched until a board-specific power manager is added and tested.
  - name: axp2101_power_manager
    chip: axp2101
    type: custom
    version: 1.0.0
    init_skip: true
    config:
      i2c_addr: 0x34
      frequency: 400000
    peripherals:
      - name: i2c_master
