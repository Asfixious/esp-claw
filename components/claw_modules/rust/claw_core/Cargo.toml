[package]
name = "claw_core"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Runtime primitives: orchestrator shell, channels, and iteration loop"

[lib]
# claw_core is a pure-Rust rlib. Its C ABI lives in the `claw_capi` crate, which
# is bundled (with the other logic crates) into the single `claw_rt` staticlib.
crate-type = ["rlib"]

[features]
# Mirrors CONFIG_CLAW_CORE_STAGE_VERBOSITY_VERBOSE (default off == "Simple").
stage_verbose = []

[dependencies]
claw_interfaces = { path = "../claw_interfaces" }
claw-utils = { path = "../claw-utils" }
claw-api = { path = "../claw-api" }
claw-memory = { path = "../claw-memory" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
claw_cap = { path = "../claw_cap" }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
