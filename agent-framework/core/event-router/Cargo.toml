[package]
name = "claw-event-router"
authors = ["Finn(Ziheng) Sheng <zsheng2@ncsu.edu>", "Finn(Ziheng) Sheng <robcholz00@gmail.com>"]
version = "0.1.0"
edition = "2021"
description = "RPC registry and event routing runtime for ESP-Claw"

[lib]
crate-type = ["rlib"]

[dependencies]
futures-core = { version = "0.3", default-features = false }
thiserror = "2"
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
futures-lite = "2"
futures-util = { version = "0.3", default-features = false, features = ["async-await", "async-await-macro"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
