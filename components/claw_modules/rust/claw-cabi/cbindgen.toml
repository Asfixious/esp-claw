# cbindgen config for the AUTHORITATIVE claw_cabi.h, generated once the ABI is
# implemented. Until then `include/claw_cabi.h` is a hand-written draft (see
# DESIGN.md) and this file is NOT yet wired into a build.rs — generating now
# would clobber the draft with an empty header.
#
# Generate manually with:
#   cbindgen --config cbindgen.toml --crate claw-cabi --output include/claw_cabi.h

language = "C"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "type"
autogen_warning = "/* AUTOGENERATED by cbindgen — do not edit by hand. See DESIGN.md. */"

header = """
/*
 * SPDX-FileCopyrightText: 2026 Espressif Systems (Shanghai) CO LTD
 *
 * SPDX-License-Identifier: Apache-2.0
 */"""

[parse]
# Every C-facing type is defined `#[repr(C)]` inside this crate, so there is no
# need to walk dependencies.
parse_deps = false

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = false

[export]
# Only the claw_capability_* / claw_inbound_* surface is intended to be public.
include = []
